server:
  port: 8080
spring:
  application:
    name: "RetoGestionFranquicias"
  devtools:
    add-properties: false
  liquibase:
    # Liquibase uses JDBC, which needs its own TLS parameters. With DB_SSL=true the connection is encrypted without
    # verifying the server certificate (same as the R2DBC connection); without DB_SSL it stays unencrypted (local).
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl=${DB_SSL:false}&sslfactory=org.postgresql.ssl.NonValidatingFactory"
    user: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    ssl: "${DB_SSL:false}"
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local,dev,staging
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
