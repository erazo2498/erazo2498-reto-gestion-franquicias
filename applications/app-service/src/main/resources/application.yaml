server:
  port: 8080
spring:
  application:
    name: "RetoGestionFranquicias"
  devtools:
    add-properties: false
  liquibase:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    user: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local,dev,staging
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
