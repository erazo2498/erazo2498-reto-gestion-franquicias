name: Deploy

# develop -> dev, automatically. staging and prod are deployed by hand (Actions -> Deploy -> Run workflow), so merging
# to main (which delivers the code) never creates or changes those environments by surprise. prod still waits for the
# reviewer set in its GitHub Environment. The image is built once per run and the same image goes to the environment.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "value=v${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: docker build -f deployment/Dockerfile -t reto-gestion-franquicias:ci .
      - run: docker save reto-gestion-franquicias:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  dev:
    if: github.event_name == 'push'
    needs: image
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      image_tag: ${{ needs.image.outputs.tag }}

  manual:
    if: github.event_name == 'workflow_dispatch'
    needs: image
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ needs.image.outputs.tag }}
