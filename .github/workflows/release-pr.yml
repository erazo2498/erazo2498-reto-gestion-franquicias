name: Release PR

# Opens the pull request develop -> main by itself, so it is never forgotten. It only OPENS it: merging stays a manual,
# reviewed decision. If the pull request is already open nothing is done (GitHub keeps it updated with every push).
on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

# A burst of merges to develop must not race to create two pull requests.
concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open the develop -> main pull request when there is something to release
        run: |
          open_pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "Pull request #$open_pr is already open; it follows develop by itself."
            exit 0
          fi

          ahead=$(gh api "repos/$GH_REPO/compare/main...develop" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "main already has everything that develop has; nothing to release."
            exit 0
          fi

          gh pr create --base main --head develop \
            --title "release: develop -> main ($(date -u +%Y-%m-%d))" \
            --body "Automatic pull request opened because \`develop\` is $ahead commit(s) ahead of \`main\`.

          It updates itself with every new merge to \`develop\`. Review it and merge it when the CI is green; \`main\` only changes when a person merges this pull request."
